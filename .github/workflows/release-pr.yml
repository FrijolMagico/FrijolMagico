name: Release PR (dev → main)

on:
  push:
    branches: [dev]

jobs:
  release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const { owner, repo } = context.repo;

            // --- 1. Find PRs merged to dev since last dev→main merge ---
            const { data: compare } = await github.rest.repos.compareCommits({
              owner, repo,
              base: 'main',
              head: 'dev',
            });

            // No new commits on dev since last main merge → skip
            if (compare.ahead_by === 0) {
              console.log('dev está al día con main — no hay cambios nuevos');
              return;
            }

            const { data: search } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} base:dev is:pr is:merged -label:released`,
              sort: 'updated',
              per_page: 50,
            });

            if (search.total_count === 0) {
              console.log('No hay PRs mergeados a dev desde el último release — skip');
              return;
            }

            // --- 2. Build release body + determine bump level ---
            let body = '# Release PR: dev → main\n\n';
            body += '## 📋 Changes included\n\n';
            const issueRefs = [];
            let level = 'patch';

            for (const item of search.items) {
              const { data: pr } = await github.rest.pulls.get({
                owner, repo,
                pull_number: item.number,
              });

              body += `- **#${pr.number}** — ${pr.title}\n`;

              // Determine bump level from labels and title
              const labels = pr.labels.map((l) => l.name);
              if (labels.includes('major') || pr.title.includes('!:')) {
                level = 'major';
              } else if (
                level !== 'major' &&
                (labels.includes('minor') ||
                  pr.title.startsWith('feat:') ||
                  pr.title.startsWith('feat('))
              ) {
                level = 'minor';
              }

              const matches = pr.body?.matchAll(
                /\b(?:close|fix|resolve)[sd]?\s+#(\d+)\b/gi
              );
              if (matches) {
                for (const m of matches) {
                  // Normalize: "fixes #123" → "Fixes #123"
                  const norm =
                    m[0].charAt(0).toUpperCase() +
                    m[0].slice(1).toLowerCase();
                  if (!issueRefs.includes(norm)) issueRefs.push(norm);
                }
              }

              // Marcar PR como liberado
              await github.rest.issues.addLabels({
                owner, repo,
                issue_number: pr.number,
                labels: ['released'],
              });
            }

            if (issueRefs.length > 0) {
              body += '\n## ✅ Issues closed\n\n';
              body += issueRefs.join(', ');
            }

            // --- 3. Version bump ---
            const versionOutput = execSync(
              `npm version --no-git-tag-version ${level}`
            )
              .toString()
              .trim();
            version = versionOutput.replace(/^v?/, '');
            execSync('git config user.name "github-actions[bot]"', { stdio: 'pipe' });
            execSync('git config user.email "github-actions[bot]@users.noreply.github.com"', { stdio: 'pipe' });
            execSync('git add package.json', { stdio: 'pipe' });
            execSync(`git commit -m "chore(release): bump to v${version}"`, {
              stdio: 'pipe',
            });
            execSync(`git tag v${version}`, { stdio: 'pipe' });
            console.log(`✅ Versión bumpada a v${version} (${level})`);

            // Add version header to body
            body = `## 🏷️ Version\n\n**v${version}** (_${level}_ bump)\n\n---\n\n${body}`;

            // --- 4. Create or update PR dev → main ---
            const { data: existing } = await github.rest.pulls.list({
              owner, repo,
              head: 'dev',
              base: 'main',
              state: 'open',
            });

            const date = new Date().toLocaleDateString('en-CA', {
              timeZone: 'America/Santiago',
            });
            const title = `Release v${version} — ${date}`;

            if (existing.length > 0) {
              await github.rest.pulls.update({
                owner, repo,
                pull_number: existing[0].number,
                title,
                body,
              });
              console.log(`✅ Release PR actualizado: #${existing[0].number}`);
            } else {
              const { data: newPR } = await github.rest.pulls.create({
                owner, repo,
                head: 'dev',
                base: 'main',
                title,
                body,
              });
              console.log(`✅ Release PR creado: #${newPR.number}`);
            }
