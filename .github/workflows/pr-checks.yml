name: PR Checks

on:
  pull_request:
    branches: [dev, main]

jobs:
  quality:
    name: Lint & Type-Check & Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          # Avoid failures from missing env vars during build
          DATA_SOURCE: mock

      - name: Lint
        run: bun run lint

      - name: Type-Check
        run: bun run type-check

      - name: Test
        run: bun run test
