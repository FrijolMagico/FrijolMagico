name: PR Checks

on:
  pull_request:

jobs:
  production-migrations:
    name: Production Migrations
    if: github.event.pull_request.base.ref == 'main' && github.head_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production-migrations
    concurrency:
      group: production-migrations
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply production migrations
        run: bun run --filter=@frijolmagico/database migrate
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

  quality:
    name: Lint & Type-Check & Build & Test
    needs: production-migrations
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful production migrations for release PRs
        if: github.event.pull_request.base.ref == 'main' && github.head_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository && needs.production-migrations.result != 'success'
        run: |
          echo "Production migrations did not succeed; failing the release PR quality check."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Block direct PRs to main
        if: github.event.pull_request.base.ref == 'main' && (github.head_ref != 'dev' || github.event.pull_request.head.repo.full_name != github.repository)
        run: |
          echo "❌ PRs directo a main solo desde dev del mismo repositorio."
          echo "Source: ${{ github.head_ref }} → main"
          exit 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create mock database
        run: |
          MOCK_DB="${GITHUB_WORKSPACE}/packages/database/mock.local.db"
          touch "$MOCK_DB"
          TURSO_DATABASE_URL="file:${MOCK_DB}" bun run --filter=@frijolmagico/database migrate

      - name: Build
        run: TURSO_DATABASE_URL="file:${GITHUB_WORKSPACE}/packages/database/mock.local.db" bun run build
        env:
          DATA_SOURCE: local

      - name: Lint
        run: bun run lint

      - name: Type-Check
        run: bun run type-check

      - name: Test
        run: TURSO_DATABASE_URL="file:${GITHUB_WORKSPACE}/packages/database/mock.local.db" bun run test

      - name: Enforce per-file test isolation
        run: |
          for pkg in apps/admin apps/web; do
            grep -q '"test": "bun test --isolate"' "$pkg/package.json" || { echo "❌ $pkg test script must run bun test --isolate"; exit 1; }
            if grep -qE '^\s*isolate\s*=\s*true' "$pkg/bunfig.toml"; then
              echo "❌ $pkg bunfig.toml uses the unsupported 'isolate' key (use the CLI flag in the test script instead)"; exit 1
            fi
          done
