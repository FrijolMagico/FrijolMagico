name: PR Checks

on:
  pull_request:

jobs:
  quality:
    name: Lint & Type-Check & Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Block direct PRs to main
        if: github.event.pull_request.base.ref == 'main' && (github.head_ref != 'dev' || github.event.pull_request.head.repo.full_name != github.repository)
        run: |
          echo "❌ PRs directo a main solo desde dev del mismo repositorio."
          echo "Source: ${{ github.head_ref }} → main"
          exit 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create, migrate and seed isolated CI database
        run: |
          set -euo pipefail
          if ! command -v sqlite3 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y sqlite3
          fi
          MOCK_DB="${GITHUB_WORKSPACE}/packages/database/mock.local.db"
          touch "$MOCK_DB"
          bun run --filter=@frijolmagico/database migrate:ci
          {
            printf '%s\n' 'PRAGMA foreign_keys=ON;'
            cat packages/database/seed/seed.sql
          } | sqlite3 -bail "$MOCK_DB"
          test "$(sqlite3 -bail "$MOCK_DB" 'PRAGMA integrity_check;')" = 'ok'
          test -z "$(sqlite3 -bail "$MOCK_DB" 'PRAGMA foreign_key_check;')"
          test "$(sqlite3 -bail "$MOCK_DB" "SELECT COUNT(*) FROM catalogo_artista catalog JOIN artista ON artista.id = catalog.artista_id WHERE artista.slug IS NULL OR trim(artista.slug) = '';")" = '0'
          test "$(sqlite3 -bail "$MOCK_DB" "SELECT COUNT(*) FROM evento_edicion WHERE slug IS NULL OR trim(slug) = '';")" = '0'
          test "$(sqlite3 -bail "$MOCK_DB" 'SELECT COUNT(*) FROM catalogo_artista;')" = '38'
          test "$(sqlite3 -bail "$MOCK_DB" 'SELECT COUNT(*) FROM evento_edicion;')" -gt '0'
          test "$(sqlite3 -bail "$MOCK_DB" 'SELECT COUNT(*) FROM __drizzle_migrations;')" = '28'

      - name: Build
        run: bun run turbo run build
        env:
          DATA_SOURCE: local
          TURSO_DATABASE_URL: file:${{ github.workspace }}/packages/database/mock.local.db
          TURSO_AUTH_TOKEN: ''

      - name: Lint
        run: bun run lint

      - name: Type-Check
        run: bun run type-check

      - name: Test
        run: bun run test
        env:
          TURSO_DATABASE_URL: file:${{ github.workspace }}/packages/database/mock.local.db
          TURSO_AUTH_TOKEN: ''

      - name: Enforce per-file test isolation
        run: |
          for pkg in apps/admin apps/web; do
            grep -q '"test": "bun test --isolate"' "$pkg/package.json" || { echo "❌ $pkg test script must run bun test --isolate"; exit 1; }
            if grep -qE '^\s*isolate\s*=\s*true' "$pkg/bunfig.toml"; then
              echo "❌ $pkg bunfig.toml uses the unsupported 'isolate' key (use the CLI flag in the test script instead)"; exit 1
            fi
          done
