name: PR Checks

on:
  pull_request:
    branches: [dev, main]

jobs:
  quality:
    name: Lint & Type-Check & Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create mock database
        run: |
          touch packages/database/mock.local.db
          TURSO_DATABASE_URL=file:./mock.local.db bun run --filter=@frijolmagico/database migrate

      - name: Build
        run: TURSO_DATABASE_URL=file:./packages/database/mock.local.db bun run build
        env:
          DATA_SOURCE: local

      - name: Lint
        run: bun run lint

      - name: Type-Check
        run: bun run type-check

      - name: Test
        run: bun run test
