name: PR Checks

on:
  pull_request:
    branches: [dev, main]

jobs:
  quality:
    name: Lint & Type-Check & Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Block direct PRs to main
        if: github.base_ref == 'main' && github.head_ref != 'dev'
        run: |
          echo "❌ PRs directo a main solo desde dev."
          echo "Source: ${{ github.head_ref }} → main"
          exit 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create mock database
        run: |
          MOCK_DB="${GITHUB_WORKSPACE}/packages/database/mock.local.db"
          touch "$MOCK_DB"
          TURSO_DATABASE_URL="file:${MOCK_DB}" bun run --filter=@frijolmagico/database migrate

      - name: Build
        run: TURSO_DATABASE_URL="file:${GITHUB_WORKSPACE}/packages/database/mock.local.db" bun run build
        env:
          DATA_SOURCE: local

      - name: Lint
        run: bun run lint

      - name: Type-Check
        run: bun run type-check

      - name: Test
        run: TURSO_DATABASE_URL="file:${GITHUB_WORKSPACE}/packages/database/mock.local.db" bun run test

      - name: Enforce per-file test isolation
        run: |
          for pkg in apps/admin apps/web; do
            grep -q '"test": "bun test --isolate"' "$pkg/package.json" || { echo "❌ $pkg test script must run bun test --isolate"; exit 1; }
            if grep -qE '^\s*isolate\s*=\s*true' "$pkg/bunfig.toml"; then
              echo "❌ $pkg bunfig.toml uses the unsupported 'isolate' key (use the CLI flag in the test script instead)"; exit 1
            fi
          done
