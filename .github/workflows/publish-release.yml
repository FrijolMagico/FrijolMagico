name: Publish Release

on:
  push:
    branches:
      - main

concurrency:
  group: publish-release-main
  cancel-in-progress: false

jobs:
  publish-release:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # ----------------------------------------------------------------------
      # 1. Crear token temporal de la GitHub App
      # ----------------------------------------------------------------------
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      # ----------------------------------------------------------------------
      # 2. Checkout exacto del commit que llegó a main
      # ----------------------------------------------------------------------
      - name: Checkout released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ----------------------------------------------------------------------
      # 3. Crear tag, GitHub Release y actualizar labels
      # ----------------------------------------------------------------------
      - name: Publish release
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('node:fs');

            const { owner, repo } = context.repo;

            /**
             * Crea un label si aún no existe.
             */
            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({
                  owner,
                  repo,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }

                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name,
                  color,
                  description,
                });

                console.log(`Label creado: ${name}`);
              }
            }

            /**
             * Normaliza los labels devueltos por la API.
             */
            function getLabelNames(pullRequest) {
              return pullRequest.labels
                .map((label) => {
                  if (typeof label === 'string') {
                    return label;
                  }

                  return label.name;
                })
                .filter(Boolean);
            }

            // ----------------------------------------------------------------
            // 1. Leer y validar la versión publicada en package.json
            // ----------------------------------------------------------------
            const packageJson = JSON.parse(
              fs.readFileSync('package.json', 'utf8')
            );

            const version = packageJson.version;

            if (
              typeof version !== 'string' ||
              !/^\d+\.\d+\.\d+$/.test(version)
            ) {
              throw new Error(
                `Versión inválida en package.json: ${version}`
              );
            }

            const tagName = `v${version}`;

            // ----------------------------------------------------------------
            // 2. Obtener PR mergeados a dev con release-pending
            // ----------------------------------------------------------------
            /*
             * Se usa pulls.list en lugar de GitHub Search para evitar depender
             * de la actualización eventual del índice de búsqueda.
             */
            const closedPullRequests = await github.paginate(
              github.rest.pulls.list,
              {
                owner,
                repo,
                state: 'closed',
                base: 'dev',
                sort: 'created',
                direction: 'asc',
                per_page: 100,
              }
            );

            const includedPullRequests = closedPullRequests.filter(
              (pullRequest) => {
                if (!pullRequest.merged_at) {
                  return false;
                }

                const labels = getLabelNames(pullRequest);

                return labels.includes('release-pending');
              }
            );

            console.log(
              `PR con release-pending encontradas: ` +
              `${includedPullRequests.length}`
            );

            if (includedPullRequests.length > 0) {
              console.log(
                includedPullRequests.map((pullRequest) => ({
                  number: pullRequest.number,
                  title: pullRequest.title,
                  labels: getLabelNames(pullRequest),
                }))
              );
            }

            // ----------------------------------------------------------------
            // 3. Comprobar si existe el tag
            // ----------------------------------------------------------------
            let existingTag = null;

            try {
              const { data } = await github.rest.git.getRef({
                owner,
                repo,
                ref: `tags/${tagName}`,
              });

              existingTag = data;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            // ----------------------------------------------------------------
            // 4. Comprobar si existe la GitHub Release
            // ----------------------------------------------------------------
            let existingRelease = null;

            try {
              const { data } =
                await github.rest.repos.getReleaseByTag({
                  owner,
                  repo,
                  tag: tagName,
                });

              existingRelease = data;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            /*
             * Si no hay PR pendientes y tampoco existe un estado parcial de
             * publicación, este push a main no corresponde a una release.
             */
            if (
              includedPullRequests.length === 0 &&
              !existingTag &&
              !existingRelease
            ) {
              console.log(
                'No existen PR con release-pending. ' +
                'Se omite la publicación.'
              );

              return;
            }

            /*
             * Si ya existe tanto el tag como la release y no quedan labels
             * pendientes, la publicación ya se completó anteriormente.
             */
            if (
              includedPullRequests.length === 0 &&
              existingTag &&
              existingRelease
            ) {
              console.log(
                `Release ${tagName} ya está completamente publicada.`
              );

              return;
            }

            // ----------------------------------------------------------------
            // 5. Crear o validar el tag
            // ----------------------------------------------------------------
            if (!existingTag) {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tagName}`,
                sha: context.sha,
              });

              console.log(
                `Tag ${tagName} creado sobre ${context.sha}.`
              );
            } else {
              /*
               * Un lightweight tag apunta directamente a un commit.
               *
               * Si en el futuro se crean annotated tags, object.type será
               * "tag" y será necesario resolver el objeto tag adicionalmente.
               */
              const tagObject = existingTag.object;

              if (tagObject.type !== 'commit') {
                throw new Error(
                  `El tag ${tagName} no es un lightweight tag. ` +
                  `Tipo encontrado: ${tagObject.type}.`
                );
              }

              if (tagObject.sha !== context.sha) {
                throw new Error(
                  `El tag ${tagName} ya existe, pero apunta a ` +
                  `${tagObject.sha} en lugar de ${context.sha}.`
                );
              }

              console.log(
                `Tag ${tagName} ya existe sobre el SHA correcto.`
              );
            }

            // ----------------------------------------------------------------
            // 6. Construir las notas de release
            // ----------------------------------------------------------------
            let releaseBody = '';

            releaseBody += '## Changes\n\n';

            for (const pullRequest of includedPullRequests) {
              releaseBody +=
                `- #${pullRequest.number} — ` +
                `${pullRequest.title} ` +
                `(@${pullRequest.user.login})\n`;
            }

            /*
             * En una recuperación parcial podría ocurrir que el tag ya exista,
             * la release aún no exista y los PR todavía tengan release-pending.
             * En ese caso se reconstruyen normalmente las notas.
             */
            releaseBody += '\n';
            releaseBody += `Commit: \`${context.sha}\`\n`;

            // ----------------------------------------------------------------
            // 7. Crear la GitHub Release si falta
            // ----------------------------------------------------------------
            if (!existingRelease) {
              const { data: createdRelease } =
                await github.rest.repos.createRelease({
                  owner,
                  repo,
                  tag_name: tagName,
                  target_commitish: context.sha,
                  name: tagName,
                  body: releaseBody,
                  draft: false,
                  prerelease: false,
                  generate_release_notes: false,
                });

              existingRelease = createdRelease;

              console.log(
                `GitHub Release ${tagName} creada.`
              );
            } else {
              console.log(
                `GitHub Release ${tagName} ya existe.`
              );
            }

            // ----------------------------------------------------------------
            // 8. Garantizar que los labels de control existan
            // ----------------------------------------------------------------
            await ensureLabel(
              'release-pending',
              'FBCA04',
              'Included in the current release PR but not yet published'
            );

            await ensureLabel(
              'released',
              '0E8A16',
              'Published as part of an official release'
            );

            // ----------------------------------------------------------------
            // 9. Actualizar estados de los PR
            // ----------------------------------------------------------------
            /*
             * Este bloque se ejecuta aunque el tag y la GitHub Release ya
             * existan. Así se recuperan ejecuciones parciales.
             */
            for (const pullRequest of includedPullRequests) {
              const labels = getLabelNames(pullRequest);

              if (labels.includes('release-pending')) {
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: pullRequest.number,
                    name: 'release-pending',
                  });

                  console.log(
                    `PR #${pullRequest.number}: ` +
                    '`release-pending` eliminado.'
                  );
                } catch (error) {
                  /*
                   * El label pudo haber sido retirado concurrentemente o
                   * manualmente. Un 404 no debe impedir aplicar released.
                   */
                  if (error.status !== 404) {
                    throw error;
                  }

                  console.log(
                    `PR #${pullRequest.number}: ` +
                    '`release-pending` ya no estaba presente.'
                  );
                }
              }

              if (!labels.includes('released')) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: pullRequest.number,
                  labels: ['released'],
                });

                console.log(
                  `PR #${pullRequest.number}: ` +
                  '`released` agregado.'
                );
              }

              console.log(
                `PR #${pullRequest.number}: ` +
                'release-pending → released'
              );
            }

            console.log(
              `Release ${tagName} publicada correctamente.`
            );
