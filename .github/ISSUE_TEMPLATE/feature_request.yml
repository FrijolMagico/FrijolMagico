name: Feature Request
description: Suggest a new capability or improvement
labels: [enhancement, status:needs-review]

body:
  - type: checkboxes
    attributes:
      label: Pre-flight Checks
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I understand this issue needs `status:approved` before a PR can be opened
          required: true

  - type: textarea
    attributes:
      label: Problem Description
      description: The pain point or use case
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed Solution
      description: How it should work
    validations:
      required: true

  - type: textarea
    attributes:
      label: Requirements / Acceptance Criteria
      description: Bullet list of what must be true for this to be done

  - type: textarea
    attributes:
      label: Out of Scope
      description: What this issue explicitly does NOT cover

  - type: textarea
    attributes:
      label: Relevant Files
      placeholder: path/to/file.ts — description

  - type: textarea
    attributes:
      label: Additional Context
      description: Mockups, alternatives, references
